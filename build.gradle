buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.flywaydb:flyway-database-postgresql:13.12.1'
    }
}

plugins {
    id 'java'
    id 'war'
    id 'org.gretty' version '5.1.0'
    id 'org.flywaydb.flyway' version '13.12.1'
}

group = 'com.github.xoaltie'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

gretty {
    servletContainer = 'tomcat11'
    contextPath = '/'
    managedClassReload = true
}

dependencies {
    implementation 'org.springframework:spring-webmvc:7.0.10'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    runtimeOnly 'org.postgresql:postgresql:42.7.14'
    implementation 'com.zaxxer:HikariCP:7.1.0'
    implementation 'org.hibernate.orm:hibernate-core:7.4.15.Final'
    implementation 'org.springframework:spring-orm:7.0.10'

    implementation 'org.hibernate.validator:hibernate-validator:9.1.6.Final'

    implementation 'tools.jackson.core:jackson-databind:3.3.0'

    runtimeOnly 'ch.qos.logback:logback-classic:1.6.6'
}